reason: upgrade
reason_details: >-
  Add the optional widefield fluorescence module to the Pavone nanoindenter.

action: install
action_details: >-
  Installed the fluorescence module (white and UV LEDs, 4-slot filter slider
  with 4 filter sets, quad-band dichroic and emission filter, fluorescence
  objective). Recalibrated both objectives against the calibration target
  (0.28935 and 0.29499 µm/px), confirmed camera alignment by stitching,
  checked all LEDs and LED controls, and verified homogeneous illumination
  with fluorescent beads through all filters. Software updated to Pavone
  1.12.8 and Prova 1.0.1 (free version). Users trained on the fluorescence
  module and imaging functions.

microscope_status_before: in_service
microscope_status_after: in_service
status_notes: In service with fluorescence imaging added.

tags:
  - upgrade
  - fluorescence
  - installation

followup: >-
  Confirm with staff which filter sets sit in which slider slot, and the
  fluorescence objective model from the barrel.

