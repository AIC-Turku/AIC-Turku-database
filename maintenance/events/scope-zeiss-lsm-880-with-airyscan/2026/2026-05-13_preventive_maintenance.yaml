reason: scheduled
reason_details: >-
  Annual vendor preventive maintenance for the Zeiss LSM 880 AS Fast. The official
  checklist documents routine system, safety, cooling, laser, calibration, detector,
  stage, focus, and application-level checks. The same vendor visit also included
  corrective follow-up for the previously reported broken correction collar on the
  40x multi-immersion objective.

action: service
action_details: >-
  Vendor preventive maintenance was completed. Environment, cabling, system condition,
  anti-vibration table, fans and filters, surge protection, ECU voltage lines,
  electrical safety, laser safety, microscope function, external cooling, equipotential
  bonding, detector function and gain response, InVis collimation, QUASAR spectral
  calibration, V-laser attenuator, laser beam profiles, AOTF settings, resolution,
  stepper-motor test, laser linearization, pinhole and MBS calibrations, detector offset
  and amplification, PMT linearization, detector SNR checks, XY stage control, Z focus,
  Z stack, visible-channel application tests, and Airyscan tests were recorded in order.
  PC ventilation was cleaned; the cooling liquid was replaced; MBS filter-wheel axles
  were cleaned and lubricated; CanCheck was updated to 14.0.8.1; and Airyscan alignment
  was checked and fine-tuned. The scan-field test failed, indicating scanner wear, and
  the vendor recommended replacement of the scanners and scanner drive boards. A
  Can29_E1 VM800 communication error was also observed when ZEN started.
  During the same visit, the field engineer repaired the correction collar on the
  LD LCI Plan APOCHROMAT 40x/1.2 Imm Korr DIC (UV)VIS-IR objective (product code
  420862-9970, serial 4932000043) and verified objective operation. The repair was
  confirmed on 2026-05-14.

microscope_status_before: limited
microscope_status_after: limited
status_notes: >-
  Limited service: images remain usable, especially with unidirectional scanning, but
  the scan-field test failed and some bidirectional scan speeds show the issue. A VM800
  startup communication error also remains open. The 40x multi-immersion objective's
  correction collar was repaired and the objective returned to normal operation.

