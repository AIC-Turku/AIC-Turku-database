terms:
  - id: unitless
    label: "Unitless"
    description: "Dimensionless value with no physical unit."

  - id: percent
    label: "Percent"
    description: "Percentage value represented in %."

  - id: mW
    label: "Milliwatt"
    description: "Optical power expressed in milliwatts."

  - id: nm
    label: "Nanometer"
    description: "Length expressed in nanometers."

  - id: um
    label: "Micrometer"
    description: "Length expressed in micrometers."

  - id: celsius
    label: "Degrees Celsius"
    description: "Temperature expressed in degrees Celsius."
    synonyms: ["C", "°C"]

  - id: px
    label: "Pixel"
    description: "Image-space distance or count expressed in pixels."
    synonyms: ["pixel", "pixels"]

  - id: A
    label: "Ampere"
    description: "Electrical current expressed in amperes."
    synonyms: ["amp", "amps", "ampere"]

  - id: h
    label: "Hour"
    description: "Elapsed time expressed in hours."
    synonyms: ["hour", "hours"]
