terms:
  - id: confocal_point
    label: Point-scanning confocal
    display_label: Point-scanning confocal
    description: Broad point-scanning confocal route family, including point-scanning super-resolution or readout workflows implemented on the confocal scanner path.
    synonyms: [LSM, laser scanning confocal, CLSM, point scanning confocal]
    covers:
      imaging_modes:
        - confocal_point
        - sted
        - resolft
        - ism
      contrast_methods: []
  - id: confocal_spinning_disk
    label: Spinning-disk confocal
    display_label: Spinning-disk confocal
    description: Broad spinning-disk confocal route family, including CSU-W1 and Borealis spinning disk implementations.
    synonyms: [SDC, spinning disk confocal, Nipkow disk confocal]
    covers:
      imaging_modes:
        - confocal_spinning_disk
      contrast_methods: []
  - id: widefield_fluorescence
    label: Widefield fluorescence
    display_label: Widefield fluorescence
    description: Broad widefield/epi fluorescence route family, including TIRF and widefield-based localization or structured illumination acquisitions when implemented through the widefield fluorescence path.
    synonyms: [widefield, epifluorescence, epi fluorescence, widefield epi]
    covers:
      imaging_modes:
        - widefield_fluorescence
        - tirf
        - sim
        - smlm
      contrast_methods:
        - reflected_brightfield
        - optical_sectioning
  - id: transmitted_light
    label: Transmitted light
    display_label: Transmitted light
    description: Broad transmitted-light route family covering brightfield and transmitted contrast methods.
    synonyms: [transmitted, brightfield, diascopic, transmitted illumination]
    covers:
      imaging_modes: []
      contrast_methods:
        - transmitted_brightfield
        - phase_contrast
        - dic
        - darkfield
        - polarized_light
  - id: light_sheet
    label: Light sheet
    display_label: Light sheet
    description: Light-sheet illumination and detection route family, including SPIM variants.
    synonyms: [SPIM, LSFM, light sheet fluorescence microscopy]
    covers:
      imaging_modes:
        - light_sheet
      contrast_methods: []
  - id: multiphoton
    label: Multiphoton
    display_label: Multiphoton
    description: Multiphoton excitation route family.
    synonyms: [two-photon, 2p, nonlinear microscopy, non-linear microscopy]
    covers:
      imaging_modes:
        - multiphoton
      contrast_methods: []
