schema_version: 1
record_type: qc_session
qc_id: qc_scope-zeiss-lsm-880-with-airyscan_20260513T0000Z_vendor_pm_v1
microscope: scope-zeiss-lsm-880-with-airyscan
started_utc: '2026-05-13T00:00:00Z'
performed_by: Zeiss field service engineer
reason: preventive_maintenance
summary: >-
  Vendor preventive-maintenance QC recorded laser power, detector SNR, stage position
  error, optical alignment, focus, and application-level checks. The scan-field test
  failed while the remaining recorded QC checks were in order.
notes: >-
  Source date only; started_utc is normalized to 00:00 UTC. Objective-plane laser power
  was measured at 100% output with a Plan-Neofluar 10x test objective. The checklist
  records the instrument as not fully operational because of the failed scan-field test
  and separately notes a VM800 startup communication error. The signed source report is
  retained outside the public repository because it contains personal data.

performed:
  - qc_type: laser_power
    details: >-
      Vendor single-point laser-power measurements at the fiber output and objective
      plane, including argon operating current and lifetime counters.
  - qc_type: stage
    details: >-
      Manual XY-stage function and 3x3 TileScanRotation.lvb position-error check at a
      512-pixel frame size.
  - qc_type: alignment
    details: >-
      Detector, collimator, spectral, beam-profile, AOTF, resolution, scan-field,
      pinhole, MBS, PMT, and Airyscan alignment/calibration checks.
  - qc_type: psf
    details: >-
      Visible-channel application checks included beads and a PSF Z scan using the
      Plan-Apo 63x oil objective; both were recorded in order.

