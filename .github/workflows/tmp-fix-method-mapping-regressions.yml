name: Fix method mapping regressions

on:
  push:
    branches:
      - fix/methods-generator-pragmatic-stabilization

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/methods-generator-pragmatic-stabilization
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Apply fixes
        run: python scripts/_tmp_fix_method_mapping_regressions.py
      - name: Regenerate template
        run: python -m scripts.generate_templates
      - name: Targeted regression checks
        run: |
          python -m scripts.validate
          PYTHONPATH=. python -m pytest -q tests/test_validate_instrument_policy.py tests/test_facility_portability.py tests/test_active_yaml_contracts.py
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve portability under explicit method mappings'
          git push origin HEAD:fix/methods-generator-pragmatic-stabilization
