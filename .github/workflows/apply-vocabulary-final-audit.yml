name: Apply verified vocabulary repair

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  apply-and-verify:
    if: github.head_ref == 'fix/vocabulary-postmerge-ci-2026-09-13'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "requirements-test.txt"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Apply vocabulary transformations and post-merge corrections
        run: |
          python -m scripts._vocab_audit_patch_validation
          python -m scripts._vocab_audit_patch_consumers
          python -m scripts._vocab_audit_patch_corrections
          python -m scripts._vocab_audit_patch_tests
          python -m scripts._vocab_final_audit_patch
          python -m scripts._vocab_postmerge_ci_patch
          rm -rf .vocab-transfer
          rm -f .github/workflows/apply-vocabulary-hardening.yml
          rm -f .github/workflows/apply-vocabulary-second-audit.yml
          rm -f .github/workflows/apply-vocabulary-final-audit.yml
          rm -f scripts/_vocab_audit_patch_common.py
          rm -f scripts/_vocab_audit_patch_validation.py
          rm -f scripts/_vocab_audit_patch_consumers.py
          rm -f scripts/_vocab_audit_patch_corrections.py
          rm -f scripts/_vocab_audit_patch_tests.py
          rm -f scripts/_vocab_final_audit_patch.py
          rm -f scripts/_vocab_postmerge_ci_patch.py
          python -m scripts.generate_templates

      - name: Syntax and source checks
        run: |
          python -m compileall -q scripts tests
          python -m scripts.generate_templates --check
          node --check assets/javascripts/charts.js
          node --check scripts/templates/virtual_microscope_runtime.js
          node --check scripts/templates/virtual_microscope_app.js
          git diff --check

      - name: Validate repository
        run: python -m scripts.validate

      - name: Run full test suite
        run: PYTHONPATH=. python -m pytest -q

      - name: Check conservative autofix
        run: |
          set +e
          python -m scripts.autofix_yaml --check
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            exit "$code"
          fi

      - name: Run strict dashboard builder
        run: python -m scripts.dashboard_builder --strict

      - name: Build MkDocs strictly
        run: mkdocs build --strict

      - name: Assert clean production tree
        run: |
          test ! -e .vocab-transfer
          test ! -e .github/workflows/apply-vocabulary-hardening.yml
          test ! -e .github/workflows/apply-vocabulary-second-audit.yml
          test ! -e .github/workflows/apply-vocabulary-final-audit.yml
          test -z "$(find scripts -maxdepth 1 -name '_vocab_audit_patch_*.py' -print -quit)"
          test ! -e scripts/_vocab_final_audit_patch.py
          test ! -e scripts/_vocab_postmerge_ci_patch.py
          git diff --check

      - name: Commit verified clean result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Fix post-merge vocabulary audit and CI regressions"
          git push origin HEAD:${{ github.head_ref }}
