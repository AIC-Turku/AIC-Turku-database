name: Fix full-suite method regressions
on:
  push:
    branches: [fix/methods-generator-pragmatic-stabilization]
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/methods-generator-pragmatic-stabilization
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Apply fixes
        run: python scripts/_tmp_fix_fullsuite_method_regressions.py
      - name: Targeted tests
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_audit_regressions.py tests/test_methods_generator_grounding_regressions.py tests/test_methods_generator_method_first.py
          python -m scripts.validate
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve compatible route selections'
          git push origin HEAD:fix/methods-generator-pragmatic-stabilization
