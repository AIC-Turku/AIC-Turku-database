name: Temporary Presentation Browser Red-Team

on:
  push:
    branches:
      - redteam/presentation-browser-chatgpt-2026-09-13
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  browser-redteam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Apply presentation fixes
        run: |
          python -m scripts.apply_presentation_redteam_fixes_temp
          python -m scripts.dashboard_builder --strict

      - name: Run full validation gate
        run: |
          python -m compileall -q scripts tests
          python -m scripts.generate_templates --check
          python -m scripts.validate
          PYTHONPATH=. python -m pytest -q
          python -m scripts.autofix_yaml --check
          python -m scripts.dashboard_builder --strict
          for file in assets/javascripts/*.js scripts/templates/virtual_microscope_app.js scripts/templates/virtual_microscope_runtime.js; do node --check "$file"; done
          mkdocs build --strict
          git diff --check

      - name: Run browser red-team
        run: |
          rm -rf presentation_redteam_artifacts
          python -m http.server 8765 --directory site > /tmp/aic-redteam-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/', timeout=1)
                  break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit('site server did not start')
          PY
          python -m scripts.presentation_browser_redteam_temp
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          base = 'http://127.0.0.1:8765/'
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 900})

              # Exercise both history and concrete QC / maintenance event pages.
              for rel in (
                  'instruments/scope-3i-csu-w1-spinning-disk/history/',
                  'events/scope-3i-csu-w1-spinning-disk/2016-10-27_laser_power_qc/',
                  'events/scope-3i-csu-w1-spinning-disk/2026-09-10_returned_to_service/',
              ):
                  response = page.goto(base + rel, wait_until='domcontentloaded')
                  assert response and response.status == 200, (rel, response.status if response else None)
                  assert 'Test Scope X1' not in page.locator('body').inner_text()

              # Methods Generator: choose a real instrument and add a draft entry.
              page.goto(base + 'methods_generator/', wait_until='domcontentloaded')
              page.wait_for_function("document.querySelectorAll('#system-select option').length > 2")
              option_text = page.locator('#system-select option').all_inner_texts()
              assert all('Test Scope X1' not in text for text in option_text), option_text
              options = page.locator('#system-select option')
              chosen = None
              for index in range(1, options.count()):
                  value = options.nth(index).get_attribute('value')
                  if value:
                      chosen = value
                      break
              assert chosen
              page.locator('#system-select').select_option(chosen)
              page.wait_for_timeout(250)
              assert page.locator('#hardware-options').is_visible()
              before = page.locator('#output-text').input_value()
              page.locator('#add-btn').click()
              page.wait_for_timeout(150)
              after = page.locator('#output-text').input_value()
              assert after != before
              assert 'Test Scope X1' not in after
              page.screenshot(path='presentation_redteam_artifacts/after_laptop_methods_interaction.png', full_page=True)

              # Virtual Microscope: raw canonical route IDs must not leak when a human label exists.
              page.goto(base + 'virtual_microscope/', wait_until='domcontentloaded')
              page.get_by_role('button', name='Suggest a configuration').click()
              page.wait_for_timeout(250)
              text = page.locator('body').inner_text()
              assert 'routes: confocal_point' not in text
              page.screenshot(path='presentation_redteam_artifacts/after_laptop_virtual_microscope.png', full_page=True)

              # Synthetic fixture must be absent from normal public surfaces and search/navigation DOM.
              for rel in ('', 'retired/', 'methods_generator/', 'status/', 'objective_pool/'):
                  page.goto(base + rel, wait_until='domcontentloaded')
                  assert 'Test Scope X1' not in page.locator('body').inner_text(), rel

              browser.close()
          PY

      - name: Upload browser audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: presentation-browser-redteam-after
          path: presentation_redteam_artifacts/
          retention-days: 7

      - name: Commit presentation fixes and generated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/dashboard/site_render.py scripts/templates/virtual_microscope_app.js tests/test_public_dashboard_presentation.py dashboard_docs mkdocs.yml
          if git diff --cached --quiet; then
            echo "No final presentation changes to commit."
          else
            git commit -m "Harden public dashboard for presentation"
            git push origin HEAD:redteam/presentation-browser-chatgpt-2026-09-13
          fi
