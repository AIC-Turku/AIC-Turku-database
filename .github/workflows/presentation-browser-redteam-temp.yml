name: Temporary Presentation Browser Red-Team

on:
  push:
    branches:
      - redteam/presentation-browser-chatgpt-2026-09-13
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  browser-redteam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Build dashboard
        run: |
          python -m scripts.generate_templates --check
          python -m scripts.dashboard_builder --strict
          mkdocs build --strict

      - name: Run browser red-team
        run: |
          python -m http.server 8765 --directory site > /tmp/aic-redteam-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/', timeout=1)
                  break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit('site server did not start')
          PY
          python -m scripts.presentation_browser_redteam_temp

      - name: Upload browser audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: presentation-browser-redteam-baseline
          path: presentation_redteam_artifacts/
          retention-days: 7
