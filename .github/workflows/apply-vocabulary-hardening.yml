name: Apply vocabulary hardening patch
on:
  push:
    branches: [fix/vocabulary-hardening-2026-09-13]
    paths: [.github/workflows/apply-vocabulary-hardening.yml]
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reconstruct and verify patch
        run: |
          cat .vocab-transfer/patch-gz-* | base64 -d | gzip -d > /tmp/vocabulary-hardening.patch
          echo "890d96d7a57a9df21bf7f13aa763aa6b30718e1ab036435c436e768288806718  /tmp/vocabulary-hardening.patch" | sha256sum -c -
          git apply --check /tmp/vocabulary-hardening.patch
          git apply /tmp/vocabulary-hardening.patch
          rm -rf .vocab-transfer
          rm .github/workflows/apply-vocabulary-hardening.yml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Verify generated templates
        run: python -m scripts.generate_templates --check
      - name: Validate data and vocabulary contracts
        run: python -m scripts.validate
      - name: Run full tests
        run: PYTHONPATH=. python -m pytest -q
      - name: Build dashboard strictly
        run: python -m scripts.dashboard_builder --strict
      - name: Build MkDocs strictly
        run: mkdocs build --strict
      - name: Commit clean verified result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden vocabulary resolution and validation"
          git push origin HEAD:fix/vocabulary-hardening-2026-09-13
