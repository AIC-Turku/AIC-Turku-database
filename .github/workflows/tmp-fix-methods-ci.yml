name: Temporary Methods CI repair

on:
  push:
    branches:
      - fix/methods-generator-pragmatic-stabilization

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/methods-generator-pragmatic-stabilization
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply repairs
        run: python scripts/_tmp_fix_methods_ci.py
      - name: Fast checks
        run: |
          python -m py_compile scripts/dashboard/instrument_view.py scripts/dashboard/optical_path_view.py scripts/lightpath/route_graph.py
          node --check assets/javascripts/methods_generator_app.js
          git diff --check
      - name: Commit repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets scripts tests
          git commit -m 'Repair Methods Generator compatibility regressions'
          git push origin HEAD:fix/methods-generator-pragmatic-stabilization
