name: Temporary route compatibility adjustment
on:
  push:
    branches: [fix/methods-generator-pragmatic-stabilization]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/methods-generator-pragmatic-stabilization
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/_tmp_methods_route_compat.py
      - run: |
          node --check assets/javascripts/methods_generator_app.js
          python -m py_compile tests/test_methods_generator_method_first.py
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets tests
          git commit -m 'Keep method-first flow compatible with manual route selection'
          git push origin HEAD:fix/methods-generator-pragmatic-stabilization
