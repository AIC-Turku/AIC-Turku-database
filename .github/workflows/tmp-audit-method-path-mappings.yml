name: Temporary method-path mapping audit

on:
  push:
    branches:
      - fix/methods-generator-pragmatic-stabilization

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/methods-generator-pragmatic-stabilization
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install pyyaml
      - run: python scripts/_tmp_audit_method_path_mappings.py
