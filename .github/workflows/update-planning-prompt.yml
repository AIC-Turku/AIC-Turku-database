name: Update planning prompt for evidence-weighted inference
on:
  push:
    branches:
      - codex/planning-prompt-evidence-weighted-inference
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message == 'Run planning prompt update script'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/planning-prompt-evidence-weighted-inference
      - name: Apply focused update
        run: python3 scripts/_update_planning_prompt_once.py
      - name: Build and test planning workflow
        run: |
          PYTHONPATH=. python -m scripts.dashboard_builder
          pytest -q tests/test_planning_grounding.py tests/test_facility_portability.py
      - name: Confirm frozen benchmark prompt unchanged
        run: git diff --exit-code benchmark/llm_planning/frozen/planning_prompt.txt
      - name: Commit final files and remove temporary machinery
        run: |
          rm scripts/_update_planning_prompt_once.py
          rm .github/workflows/update-planning-prompt.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/templates/plan_experiments.md.j2 docs/planning_grounding.md tests/test_planning_grounding.py scripts/_update_planning_prompt_once.py .github/workflows/update-planning-prompt.yml
          git commit -m 'Improve planning prompt with evidence-weighted inference'
          git push origin HEAD:codex/planning-prompt-evidence-weighted-inference
