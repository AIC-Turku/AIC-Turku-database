name: Finish explicit method path migration

on:
  push:
    branches:
      - fix/methods-generator-pragmatic-stabilization

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/methods-generator-pragmatic-stabilization
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Apply migration
        run: python scripts/_tmp_finish_method_path_migration.py
      - name: Regenerate template
        run: python -m scripts.generate_templates
      - name: Validate migration
        run: |
          python -m scripts.validate
          PYTHONPATH=. python -m pytest -q tests/test_active_yaml_contracts.py
          git diff --check
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete explicit method-to-path migration'
          git push origin HEAD:fix/methods-generator-pragmatic-stabilization
