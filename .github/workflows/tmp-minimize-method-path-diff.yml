name: Temporary minimize method-path diff

on:
  push:
    branches:
      - fix/methods-generator-pragmatic-stabilization

permissions:
  contents: write

jobs:
  minimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/methods-generator-pragmatic-stabilization
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Rebuild minimal mapping diff
        run: python scripts/_tmp_minimize_method_path_diff.py
      - name: Regenerate template
        run: python -m scripts.generate_templates
      - name: Targeted checks
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_active_yaml_contracts.py tests/test_methods_generator_method_first.py
          python -m scripts.validate
          git diff --check
      - name: Commit minimal diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add instruments schema templates tests
          git commit -m 'Minimize explicit method-path mapping diff'
          git push origin HEAD:fix/methods-generator-pragmatic-stabilization
