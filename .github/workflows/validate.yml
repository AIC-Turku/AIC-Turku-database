name: Validate Dashboard Content

on:
  pull_request:
    paths:
      - "tests/**"
      - "vocab/**"
      - "facility.yaml"
      - "acknowledgements.yaml"
      - "mkdocs.yml"
      - "requirements-test.txt"
      - "schema/**"
      - "docs/**"
      - "inventory/**"
      - "instruments/**"
      - "qc/**"
      - "maintenance/**"
      - "scripts/**"
      - "assets/**"
      - "templates/**"
      - "requirements.txt"
      - "requirements-docs.txt"
      - ".github/workflows/validate.yml"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install system dependencies for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "requirements-docs.txt"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Check generated templates are up to date
        run: python -m scripts.generate_templates --check

      - name: Validate YAML/schema/cross-references/naming
        run: python -m scripts.validate

      - name: Run complete test suite (including browser regressions)
        run: PYTHONPATH=. python -m pytest -q

      - name: Run dashboard builder (strict)
        run: python -m scripts.dashboard_builder --strict

      - name: Generate Audit PDFs
        run: python -m scripts.generate_audit_pdfs

      - name: Upload audit report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: microscope-audit-reports
          path: audit_reports/
          retention-days: 30

      - name: Build MkDocs (strict)
        run: mkdocs build --strict

      - name: Replay original 116 Methods Generator scenarios
        run: |
          python -m http.server 8000 --directory site >/tmp/methods-audit-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/methods_generator/ >/dev/null; then
              break
            fi
            sleep 1
          done
          python scripts/replay_methods_116_audit.py \
            --url http://127.0.0.1:8000/methods_generator/ \
            --json methods-116-rerun.json \
            --markdown methods-116-rerun.md

      - name: Upload 116-scenario replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: methods-generator-116-rerun
          path: |
            methods-116-rerun.json
            methods-116-rerun.md
            /tmp/methods-audit-http.log
          if-no-files-found: warn
          retention-days: 7
