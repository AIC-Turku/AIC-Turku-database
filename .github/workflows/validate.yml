name: Validate Dashboard Content

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "requirements-docs.txt"

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Build current dashboard and rendered site
        run: |
          python -m scripts.dashboard_builder --strict
          mkdocs build --strict

      - name: Replay original 116 Methods Generator scenarios
        run: |
          python -m http.server 8000 --directory site >/tmp/methods-audit-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/methods_generator/ >/dev/null; then
              break
            fi
            sleep 1
          done
          PYTHONPATH=. python scripts/replay_methods_116_audit_v3.py \
            --url http://127.0.0.1:8000/methods_generator/ \
            --json methods-116-rerun.json \
            --markdown methods-116-rerun.md

      - name: Upload 116-scenario replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: methods-generator-116-rerun
          path: |
            methods-116-rerun.json
            methods-116-rerun.md
            /tmp/methods-audit-http.log
          if-no-files-found: warn
          retention-days: 7
