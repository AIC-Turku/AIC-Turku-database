  optical_path_elements:
  - name: BC43 Internal Dichroic
    stage_role: dichroic
    id: bc43_internal_dichroic
    element_type: fixed
    notes: Expected to be a quad-band dichroic for the 405/488/561/638 nm lines; the part number and cut-off wavelengths are not recorded.
  - name: BC43 Internal Emission Filters
    slots: 4
    stage_role: emission
    id: bc43_internal_emission_filters
    element_type: filter_wheel
    notes: 'The band centres and widths match the Semrock emitters listed for published BC43 configurations (FF01-445/20, FF02-529/24, FF01-595/31, FF01-708/75); facility staff have not yet confirmed that these exact parts are fitted to this unit.'
    positions:
      Pos_1:
        name: DAPI
        component_type: bandpass
        bands:
        - center_nm: 445
          width_nm: 20
      Pos_2:
        name: GFP
        component_type: bandpass
        bands:
        - center_nm: 529
          width_nm: 24
      Pos_3:
        name: mCherry
        component_type: bandpass
        bands:
        - center_nm: 595
          width_nm: 31
      Pos_4:
        name: CY5
        component_type: bandpass
        bands:
        - center_nm: 708
          width_nm: 75
