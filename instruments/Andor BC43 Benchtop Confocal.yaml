  - differential_phase_contrast
  readouts: []
  workflows:
  - live_cell_imaging
  assay_operations: []
  non_optical: []
modules:
- type: hardware_autofocus
  notes: Dual function Focus Seek and Lock (FSL). Focus stabilization relies on the Find Coverslip function, which Fusion offers only for air objectives above 2x and for water objectives. FSL can be switched on with any objective but may not work as intended with the 2x air, silicone or oil objectives.
  url: ''
  manufacturer: Andor
  model: Focus Seek and Lock
- type: incubation
  notes: TOPSTAGE-ANDOR-BL3 Incubator Bundle (T/H/CO2)
  url: ''
  manufacturer: Andor
  model: TOPSTAGE-ANDOR-BL3 Incubator Bundle
software:
- role: acquisition
  name: Fusion BC43
  version: 2.7.0
  developer: Andor
  notes: 'Activated modules: Focus Map and Tilt Correction; Irregular Montage.'
  url: https://fusion-benchtop-software-guide.scrollhelp.site/bc43softwareguide/
- role: analysis
  name: Imaris Viewer
  version: 11.0.0
  developer: Oxford Instruments / Andor
  notes: Imaris Viewer is the only analysis software installed on the acquisition PC. An offline Imaris Quant licence was part of the purchase but is not installed at present.
  url: ''
