    model: Kinetix22
    pixel_pitch_um: 6.5
    sensor_format_px: 2400 x 2400
    qe_peak_pct: 95
    read_noise_e: 0.7
    notes: Back-illuminated sCMOS, 22 mm sensor diagonal (5.76 MP). Replaced the Hamamatsu ORCA-Flash4.0 V3 in October 2026. Sensor format, peak QE and read noise are the manufacturer specification, not measured values; peak QE is 95% in the supplier quotation and 96% in the current Photometrics datasheet. Read noise depends on the readout mode, 0.7 e- in Sub-Electron mode, 1.2 e- Sensitivity (12-bit), 1.6 e- Dynamic Range (16-bit), 2.0 e- Speed (8-bit).
    url: https://www.photometrics.com/products/kinetix-family/kinetix22
    id: kinetix22
