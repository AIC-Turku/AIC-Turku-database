  - tirf
  notes: The Spectra X LEDs give widefield epi-fluorescence through the standard cubes. Since October 2026 the 405/488/561/638 nm lasers enter through the iLas2 TIRF/FRAP illuminator and the TIRF cube for TIRF and laser epi illumination; the same illuminator performs FRAP.
- id: transmitted_light
