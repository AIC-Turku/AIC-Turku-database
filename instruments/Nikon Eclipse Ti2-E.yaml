instrument:
  display_name: Nikon Eclipse Ti2-E
  instrument_id: scope-nikon-eclipse-ti2-e
  manufacturer: Nikon
  model: Eclipse Ti2-E
  year_of_purchase: '2017'
  funding: ''
  stand_orientation: inverted
  ocular_availability: trinocular
  location: BioCity, 5th floor, room Dunkel
  notes: 'Automated inverted microscope (high-content). Imaging modes: Widefield fluorescence (multichannel spectral imaging), Brightfield (and DIC), Time-lapse live-cell imaging (with autofocus), High-content screening (multi-well scanning). Upgraded in October 2026 with an iLas2 motorized azimuthal TIRF/FRAP illuminator (TIRF, FRAP, photobleaching, photoactivation and photoconversion), a 405/488/561/638 nm laser unit, and a Photometrics Kinetix22 sCMOS camera.'
  url: ''
capabilities:
  imaging_modes:
  - widefield_fluorescence
  - tirf
  contrast_methods:
  - transmitted_brightfield
  - dic
  - phase_contrast
  readouts: []
  workflows:
  - live_cell_imaging
  - high_content_screening
  - smart_microscopy
  assay_operations:
  - frap
  - photobleaching
  - photoactivation
  non_optical: []
modules:
- type: incubation
  notes: Enclosed incubation chamber (Okolab) with temperature control (Okolab H201-T). A multiwell plate holder and an Okolab laser-interlock lid for TIRF/FRAP were added in October 2026.
  url: ''
  manufacturer: Okolab
  model: H201-T
- type: hardware_autofocus
  notes: Nikon Perfect Focus System (autofocus)
  url: ''
  manufacturer: Nikon
  model: Perfect Focus System
- type: tirf
  notes: iLas2 galvanometer-based TIRF and FRAP illuminator (ILAS2-TIRF/FRAP, MGTC0002) for point and motorized azimuthal (360 degree) TIRF, on a Ti2 motorized main laser branch (TI2-LA-BM-E). Controlled from NIS-Elements through the iLas2 TIRF/FRAP driver. Installed October 2026.
  url: ''
  manufacturer: Gataca Systems (supplied by Nikon)
  model: iLas2 TIRF/FRAP
- type: frap
  notes: FRAP and targeted photobleaching are performed by the same iLas2 TIRF/FRAP illuminator, on user-defined regions, and can be combined with TIRF or widefield acquisition. Installed October 2026.
  url: ''
  manufacturer: Gataca Systems (supplied by Nikon)
  model: iLas2 TIRF/FRAP
- type: hardware_triggering
  notes: National Instruments PCIe-6738 analog output card (32 analog outputs, 16-bit) with shielded 68-pin cable, installed with the October 2026 upgrade for hardware-timed control of devices from NIS-Elements.
  url: ''
  manufacturer: National Instruments
  model: PCIe-6738
- type: photoactivation
  notes: Photoactivation and photoconversion of photoactivatable or photoconvertible probes in user-defined regions, using the iLas2 TIRF/FRAP illuminator with the 405 nm laser line. Installed October 2026.
  url: ''
  manufacturer: Gataca Systems (supplied by Nikon)
  model: iLas2 TIRF/FRAP
software:
- role: acquisition
  name: Nikon NIS-Elements AR
  version: '6.1'
  notes: Controls the iLas2 TIRF/FRAP illuminator and the laser unit through the iLas2 driver. JOBS is installed for scripted and automated acquisition.
  url: ''
hardware:
  environment:
    temperature_control: true
    co2_control: true
    humidity_control: true
    notes: Enclosed incubation chamber (Okolab) with temperature control (Okolab H201-T)
