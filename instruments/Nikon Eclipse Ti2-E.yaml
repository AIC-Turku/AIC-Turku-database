        name: Standard Cubes
        component_type: filter_cube
        notes: Standard DAPI, CFP, GFP, YFP, and TexasRed cubes
        compatible_source_ids:
        - spectra_x_395
        - spectra_x_440
        - spectra_x_475
        - spectra_x_550
        - spectra_x_575
        - spectra_x_640
        - spectra_x_730
      Pos_2:
        name: Chroma TRF89901-EMv2 405/488/561/640 TIRF cube
        manufacturer: Chroma
        product_code: TRF89901-EMv2
        component_type: filter_cube
        compatible_source_ids:
        - laser_405
        - laser_488
        - laser_561
        - laser_638
        notes: 'Laser TIRF cube for Nikon Ti, installed October 2026. Pos_2 orders it after the standard cubes; the physical turret slot is not recorded. Excitation ZET405/488/561/640xv2 (passbands not recorded). Dichroic ZT405/488/561/640rpcv2 reflects 380-410, 482-493, 556-566 and 630-647 nm (manufacturer specification). The matching single-band emitters (445/58, 525/50, 595/44, 706/95) were supplied for the emission wheel; their wheel positions are not recorded.'
        dichroic:
          component_type: multiband_dichroic
          cutoffs_nm:
          - 410
          - 493
          - 566
          - 647
  - name: DIC Fixed Analyzer
    stage_role: analyzer
    id: analyzer_slider
    element_type: slider
    positions:
      Pos_1:
        component_type: analyzer
        notes: For DIC imaging
  - name: Trinocular Port
    stage_role: splitter
    id: trinocular_port
    element_type: splitter
    selection_mode: exclusive
    supported_branch_modes:
    - selected
    supported_branch_count: 3
    notes: Routes light between oculars and dual camera ports.
