  location: BioCity, 5th floor, room 5149
  notes: 'State-of-the-art inverted confocal laser-scanning microscope supporting standard confocal and super-resolution AiryScan imaging. Dedicated for fast and sensitive live-cell imaging with a full incubation chamber. Imaging modes: conventional confocal scanning with spectral detection and first-generation Airyscan super-resolution imaging with Airyscan Fast mode installed. Reservation system: Zeiss LSMM880 with AiryScan. Fluorophore selection guide available for users.'
